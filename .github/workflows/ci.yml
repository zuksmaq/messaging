name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: build and test
        run: |
          go build ./...
          go test ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Tagged tests stand up real brokers/databases via testcontainers,
      # so they run in their own job rather than slowing every push.
      - name: integration tests
        run: go test -tags integration -timeout 20m ./...
