name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: build and test (workspace off, per-module)
        run: |
          for m in . kafka outbox inbox; do
            (cd "$m" && GOWORK=off go build ./... && GOWORK=off go test ./...)
          done

      - name: build and test (workspace on)
        run: |
          go build ./...
          go test ./...
